- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Serves the theme from Jellyfin Web instead of the Custom CSS field, and stops
  the page settling in front of the viewer. Jellyfin renders Custom CSS from a
  React component gated on the branding request, so a theme pasted there cannot
  apply until after the first paint: the page shows stock Jellyfin colours and
  landscape home rows, then snaps. The plugin now embeds the six compiled
  palettes and writes the selected one into index.html beside the pre-paint
  layer, with a configuration page to pick it and no restart needed to change
  it. The pre-paint layer also stops revealing content twice: its reveal was a
  keyframe animation starting from zero, so cards the failsafe had already
  shown blinked out and faded back in once the helper decided them. Library
  posters no longer turn a flat colour on hover either, which came from the
  React card's full-size overlay link inheriting the artwork frame's surface
  colour.
