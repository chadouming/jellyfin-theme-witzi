overview: "Persistent 2:3 episode posters generated from each video"
description: >
  Extracts representative frames with Jellyfin's configured media encoder,
  arranges them into a Witzi-styled portrait poster with randomized borders,
  stores the JPEG beside the episode video, and registers it as the episode
  Primary image. Also installs the embedded Witzi browser helper into Jellyfin
  Web so detail-page content and portrait home cards work without a separate
  JavaScript Injector plugin.
category: "Metadata"
owner: "chadouming"
artifacts:
- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Adds a post-scan pass that restores any Witzi poster a library scan replaced.
  Whether the local image provider wins Jellyfin's merge depends on the library's
  configured image fetcher order, so offering the poster is not on its own a
  guarantee. Running after the scan converges regardless, never generates
  artwork, and records what it restored in witzi-episode-posters-scan.log. Home
  rows also stop showing Jellyfin's landscape frame before swapping to the
  poster: the card artwork is held back until the helper has settled on an
  image.
