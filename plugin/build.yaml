overview: "Persistent 2:3 episode posters generated from each video"
description: >
  Extracts representative frames with Jellyfin's configured media encoder,
  arranges them into a Witzi-styled portrait poster with randomized borders,
  stores the JPEG beside the episode video, and registers it as the episode
  Primary image. Also installs the embedded Witzi browser helper into Jellyfin
  Web so detail-page content and portrait home cards work without a separate
  JavaScript Injector plugin.
category: "Metadata"
owner: "chadouming"
artifacts:
- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Stops reporting a poster as failed when Jellyfin is saving the same episode at
  the same time. Registering artwork rewrites the whole item, including its
  provider rows, and Jellyfin offers no narrower save, so a metadata refresh
  touching the same episode can still win the race after the retries. The poster
  file and its sidecar are already installed by that point, and both the local
  image provider and the post-scan pass select it afterwards, so the write now
  reports a deferral instead of throwing. Those episodes are counted as
  registration-deferred rather than failed, and the retry backs off further.
