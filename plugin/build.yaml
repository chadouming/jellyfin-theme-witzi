framework: "net10.0"
overview: "Persistent 2:3 episode posters generated from each video"
description: >
  Extracts representative frames with Jellyfin's configured media encoder,
  arranges them into a Witzi-styled portrait poster with randomized borders,
  stores the JPEG beside the episode video, and registers it as the episode
  Primary image. Also installs the embedded Witzi browser helper into Jellyfin
  Web so detail-page content and portrait home cards work without a separate
  JavaScript Injector plugin.
category: "Metadata"
owner: "chadouming"
artifacts:
- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Adopts the theme's version number so the plugin and stylesheet ship as one
  release. Rewrites Jellyfin Web's index.html through an atomic rename so an
  interrupted write can no longer truncate the web client, and injects a
  pre-paint stylesheet into head so a detail page stops assembling itself in
  front of the viewer. Fixes a short-read comparison that renamed intact poster
  sidecars into backups on every run, replaces the per-episode directory scan
  used to find sidecars, and stops re-reading both posters in full to confirm
  artwork that has not changed.
