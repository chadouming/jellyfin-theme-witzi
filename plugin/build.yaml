version: "1.1.20.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Persistent 2:3 episode posters generated from each video"
description: >
  Extracts representative frames with Jellyfin's configured media encoder,
  arranges them into a Witzi-styled portrait poster with randomized borders,
  stores the JPEG beside the episode video, and registers it as the episode
  Primary image. Also installs the embedded Witzi browser helper into Jellyfin
  Web so detail-page content and portrait home cards work without a separate
  JavaScript Injector plugin.
category: "Metadata"
owner: "chadouming"
artifacts:
- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Stops a library scan replacing generated posters with Jellyfin's default
  episode artwork. Installing the poster under the recognized sidecar name only
  selected it once, and a scan rebuilds that choice from whatever the image
  providers return. The plugin now contributes the Witzi poster as a local image
  provider, so it takes part in every refresh, is offered ahead of Jellyfin's own
  episode provider, and marks the Primary image as stored with the media, which
  suppresses the remote fetch that downloaded a screenshot over it.
