overview: "Persistent 2:3 episode posters generated from each video"
description: >
  Extracts representative frames with Jellyfin's configured media encoder,
  arranges them into a Witzi-styled portrait poster with randomized borders,
  stores the JPEG beside the episode video, and registers it as the episode
  Primary image. Also installs the embedded Witzi browser helper into Jellyfin
  Web so detail-page content and portrait home cards work without a separate
  JavaScript Injector plugin.
category: "Metadata"
owner: "chadouming"
artifacts:
- "Jellyfin.Plugin.WitziEpisodePosters.dll"
changelog: >
  Fixes poster registration failing on PostgreSQL. Saving an episode also writes
  the shared ItemValues rows for its genres, studios, and tags, and Jellyfin
  looks a row up before inserting it, so two episodes of one series saved at the
  same time raced to insert the same value and violated the unique index on
  Type and Value. SQLite never showed this because Jellyfin serializes writes
  there. Frame extraction stays parallel; the repository write is now serialized
  and retried when a concurrent library scan writes the same values. Episodes
  that hit this were reported as failed and kept their previous artwork.
