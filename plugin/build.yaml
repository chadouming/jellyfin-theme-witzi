changelog: >
  Serves the theme, pre-paint layer, and browser helper with Jellyfin Web's
  index.html response instead of writing them into the file. The on-disk edit
  only reached the browser where the Jellyfin service account could write the
  web folder, and a Jellyfin Web upgrade replaced the file and took the blocks
  with it; on such a server, picking a palette changed nothing on screen and the
  theme still had to come from the branding Custom CSS field. ASP.NET middleware
  registered with the host now adds the blocks to the response as Jellyfin
  serves it, reading the configuration per request, so a palette applies on the
  next page load with nothing written anywhere and no restart. It touches only
  the web shell request and only a GET returning 200 text/html, and serves the
  original bytes on any failure. The on-disk write stays available behind a
  configuration toggle for a server where something other than Jellyfin serves
  the web folder; while it is off, the startup task clears the blocks releases
  1.1.24 and 1.1.25 wrote into index.html.
